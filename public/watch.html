<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101623">
  <title>Puente — Ver pantalla</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/viewer.js"></script>
</head>
<body class="viewer-body">
  <header class="viewer-header">
    <a class="brand brand-light" href="/" aria-label="Puente">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 25c7-15 23-15 30 0"/><circle cx="5" cy="25" r="3"/><circle cx="35" cy="25" r="3"/></svg>
      Puente
    </a>
    <div class="viewer-status"><span id="viewer-dot" class="status-dot waiting"></span><span id="viewer-status">Buscando la transmisión</span></div>
  </header>
  <main class="viewer-main">
    <div id="video-frame" class="video-frame viewer-frame" tabindex="-1">
      <video id="remote-video" autoplay playsinline muted></video>
      <div id="viewer-message" class="viewer-message">
        <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M12 51c14-30 42-30 56 0"/><circle cx="12" cy="51" r="5"/><circle cx="68" cy="51" r="5"/></svg>
        <h1 id="message-title">La pantalla aparecerá acá</h1>
        <p id="message-detail">Estamos estableciendo una conexión segura. No necesitás instalar nada.</p>
      </div>
    </div>
    <div class="viewer-toolbar">
      <p id="viewer-note" role="status">Transmisión cifrada</p>
      <div class="viewer-actions">
        <button id="sound-button" class="viewer-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/></svg>
          <span>Activar sonido</span>
        </button>
        <button id="mic-button" class="viewer-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span>Activar micrófono</span>
        </button>
        <button id="release-button" class="viewer-button" type="button" title="Suelta en la otra computadora todas las teclas y botones, incluidos Ctrl, Shift, Alt y Cmd" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
          Soltar teclas
        </button>
        <button id="control-button" class="viewer-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l6 16 2.5-6.5L20 10z"/></svg>
          <span>Pedir control</span>
        </button>
        <button id="fullscreen-button" class="viewer-button" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          Pantalla completa
        </button>
      </div>
    </div>
    <details class="connection-details viewer-details">
      <summary>Información de la conexión <span id="viewer-route-summary">Sin datos</span></summary>
      <dl class="metrics-grid">
        <div><dt>Estado</dt><dd data-metric="state">–</dd></div>
        <div><dt>Ruta</dt><dd data-metric="route">–</dd></div>
        <div><dt>Protocolo</dt><dd data-metric="protocol">–</dd></div>
        <div><dt>Resolución recibida</dt><dd data-metric="resolution">–</dd></div>
        <div><dt>Fotogramas</dt><dd data-metric="fps">–</dd></div>
        <div><dt>Bitrate</dt><dd data-metric="bitrate">–</dd></div>
        <div><dt>Latencia</dt><dd data-metric="latency">–</dd></div>
        <div><dt>Pérdida</dt><dd data-metric="loss">–</dd></div>
        <div><dt>Variación</dt><dd data-metric="jitter">–</dd></div>
      </dl>
    </details>
  </main>
</body>
</html>
