name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos deploys simultáneos; si llega un push nuevo, espera al anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v5

      - name: Validar sintaxis
        run: npm run check

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY_DEPLOY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar archivos
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Construir, levantar y limpiar
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "Falta $DEPLOY_PATH/.env en el servidor" >&2
            exit 1
          fi

          for var in AUTH_USERNAME AUTH_PASSWORD SESSION_SECRET; do
            if ! grep -qE "^${var}=.+" .env; then
              echo "Falta ${var} en $DEPLOY_PATH/.env; no se despliega para no dejar el sitio sin login" >&2
              exit 1
            fi
          done

          # --wait espera a que el healthcheck de la app pase; si falla, el job falla.
          docker compose -p puente up -d --build --remove-orphans --wait --wait-timeout 120

          # Borra la imagen anterior (queda "dangling" al reconstruir) y la caché
          # de build huérfana. No toca imágenes etiquetadas ni las de otros proyectos en uso.
          docker image prune -f
          docker builder prune -f

          docker compose -p puente ps
          df -h / | tail -1
          EOF

      - name: Comprobar desde fuera
        run: |
          domain=$(ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "grep -E '^DOMAIN=' '${DEPLOY_PATH}/.env' | cut -d= -f2-")
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://${domain}/healthz"

      - name: Limpiar clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
